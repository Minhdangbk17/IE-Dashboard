{% extends "base.html" %}
{% block title %}New Account{% endblock %}
{% block content %}
<div class="d-flex flex-justify-between flex-items-center mb-3">
    <h2 class="mt-0">New Account</h2>
    <a class="btn btn-sm" href="{{ url_for('admin.list_accounts') }}">&larr; Accounts</a>
</div>
<div class="Box p-3" style="max-width:480px;">
<form method="POST">
    <div class="form-group">
        <label for="username">Username</label>
        <input class="form-control" type="text" id="username" name="username" value="{{ form.get('username', '') }}" required>
    </div>
    <div class="form-group">
        <label for="full_name">Full Name</label>
        <input class="form-control" type="text" id="full_name" name="full_name" value="{{ form.get('full_name', '') }}" required>
    </div>
    <div class="form-group">
        <label for="password">Password (minimum 6 characters)</label>
        <input class="form-control" type="password" id="password" name="password" minlength="6" required>
    </div>
    <div class="form-group">
        <label for="role">Role</label>
        <select class="form-select" id="role" name="role">
            <option value="operator" {% if form.get('role', 'operator') == 'operator' %}selected{% endif %}>operator</option>
            <option value="admin" {% if form.get('role') == 'admin' %}selected{% endif %}>admin</option>
        </select>
    </div>
    <button class="btn btn-primary" type="submit">Create Account</button>
</form>
</div>
{% endblock %}
